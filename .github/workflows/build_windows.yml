name: Build Windows EXE and Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows desktop & get packages
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
        shell: pwsh

      - name: Build Windows Release (.exe)
        run: flutter build windows --release
        shell: pwsh

      - name: Build Windows Installer (setup.exe)
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: pwsh

      - name: Upload Installer (setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: yt-downloader-installer
          path: Output/yt_downloader_setup.exe
